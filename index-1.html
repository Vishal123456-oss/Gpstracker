<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live GPS Tracker</title>
<style>
body{font-family:Arial,sans-serif;background:#f2f4f7;margin:0;padding:20px}
.card{max-width:480px;margin:auto;background:#fff;padding:22px;border-radius:16px;box-shadow:0 3px 15px #0002}
h1{text-align:center}
.status{text-align:center;padding:12px;border-radius:10px;background:#eee;font-weight:bold}
.on{background:#d9f7df;color:#08752a}.off{background:#ffe0e0;color:#a00000}
.row{display:flex;justify-content:space-between;background:#f5f6f8;padding:12px;margin:8px 0;border-radius:9px}
button{width:100%;padding:15px;margin-top:10px;border:0;border-radius:10px;font-size:17px;font-weight:bold}
#start{background:#16803c;color:#fff}#stop{background:#c62828;color:#fff;display:none}
#msg{text-align:center;margin-top:12px;color:#555}
</style>
</head>
<body>
<div class="card">
<h1>🏍️ Live GPS Tracker</h1>
<div id="status" class="status off">🔴 Tracking OFF</div>
<div class="row"><b>Latitude</b><span id="lat">-</span></div>
<div class="row"><b>Longitude</b><span id="lng">-</span></div>
<div class="row"><b>Speed</b><span id="speed">-</span></div>
<div class="row"><b>Accuracy</b><span id="acc">-</span></div>
<div class="row"><b>Last update</b><span id="time">-</span></div>
<button id="start">🟢 START TRACKING</button>
<button id="stop">🔴 STOP TRACKING</button>
<div id="msg">Location sharing is OFF</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA4hzTL8iHzrd8bMxyg7NECZZQjNqYMoXQ",
  authDomain: "bike-fb123.firebaseapp.com",
  projectId: "bike-fb123",
  storageBucket: "bike-fb123.firebasestorage.app",
  messagingSenderId: "754680381192",
  appId: "1:754680381192:web:28c5153271e3550171b6bd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const locationRef = doc(db, "Live location", "Phone001");

let watchId = null;

const status = document.getElementById("status");
const msg = document.getElementById("msg");
const start = document.getElementById("start");
const stop = document.getElementById("stop");

start.onclick = () => {
  if (!navigator.geolocation) {
    msg.textContent = "GPS is not supported on this phone.";
    return;
  }

  msg.textContent = "GPS permission maang raha hai...";
  watchId = navigator.geolocation.watchPosition(async (p) => {
    const lat = p.coords.latitude;
    const lng = p.coords.longitude;
    const acc = p.coords.accuracy || 0;
    const spd = p.coords.speed == null ? 0 : p.coords.speed * 3.6;
    const now = new Date();

    document.getElementById("lat").textContent = lat.toFixed(6);
    document.getElementById("lng").textContent = lng.toFixed(6);
    document.getElementById("speed").textContent = spd.toFixed(1) + " km/h";
    document.getElementById("acc").textContent = acc.toFixed(1) + " m";
    document.getElementById("time").textContent = now.toLocaleTimeString();

    status.textContent = "🟢 Tracking LIVE";
    status.className = "status on";
    msg.textContent = "Location Firebase mein bheji ja rahi hai.";

    try {
      await setDoc(locationRef, {
        latitude: lat,
        longitude: lng,
        speed: spd,
        accuracy: acc,
        timestamp: new Date(),
        isTracking: true,
        device: "Phone001"
      }, {merge:true});
    } catch(e) {
      console.error(e);
      msg.textContent = "Firebase error: " + e.message;
    }
  }, (e) => {
    status.textContent = "🔴 GPS ERROR";
    status.className = "status off";
    msg.textContent = e.code === 1 ? "Location permission allow karo." : "GPS error: " + e.message;
  }, {enableHighAccuracy:true, maximumAge:3000, timeout:10000});

  start.style.display = "none";
  stop.style.display = "block";
};

stop.onclick = async () => {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  status.textContent = "🔴 Tracking OFF";
  status.className = "status off";
  msg.textContent = "Location sharing stopped.";
  start.style.display = "block";
  stop.style.display = "none";
  try {
    await setDoc(locationRef, {isTracking:false,timestamp:new Date()},{merge:true});
  } catch(e) {}
};
</script>
</body>
</html>
