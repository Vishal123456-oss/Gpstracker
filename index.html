<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live GPS Tracker</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#f1f3f8;font-family:Arial,sans-serif}
.card{max-width:390px;margin:20px auto;background:white;padding:18px;border-radius:15px;box-shadow:0 4px 15px rgba(0,0,0,.15)}
h2{text-align:center;margin:5px 0 15px}
.status{text-align:center;padding:9px;border-radius:8px;margin-bottom:12px;font-weight:bold;background:#ffe0e0;color:#d00000}
.status.on{background:#d9f8df;color:#12852d}
.row{display:flex;justify-content:space-between;align-items:center;background:#f5f6f8;padding:10px;margin:6px 0;border-radius:7px;font-size:14px}
.value{font-weight:bold;text-align:right;max-width:65%;word-break:break-word}
button{width:100%;border:none;padding:13px;margin-top:10px;border-radius:8px;font-size:15px;font-weight:bold;cursor:pointer}
#startBtn{background:#159447;color:white} #stopBtn{background:#d32626;color:white}
button:disabled{opacity:.55}
.message{text-align:center;margin-top:12px;color:#666;font-size:13px;min-height:20px}
</style>
</head>
<body>
<div class="card">
<h2>🏍️ Live GPS Tracker</h2>
<div id="status" class="status">🔴 Tracking OFF</div>
<div class="row"><span>Latitude</span><span id="latitude" class="value">-</span></div>
<div class="row"><span>Longitude</span><span id="longitude" class="value">-</span></div>
<div class="row"><span>Speed</span><span id="speed" class="value">-</span></div>
<div class="row"><span>Accuracy</span><span id="accuracy" class="value">-</span></div>
<div class="row"><span>Last Update</span><span id="lastUpdate" class="value">-</span></div>
<button id="startBtn">🟢 START TRACKING</button>
<button id="stopBtn" disabled>🔴 STOP TRACKING</button>
<div id="message" class="message">Start button dabakar GPS permission allow karein.</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyA4hzTL8iHzrd8bMxyg7NECZZQjNqYMoXQ",
  authDomain: "bike-fb123.firebaseapp.com",
  projectId: "bike-fb123",
  storageBucket: "bike-fb123.firebasestorage.app",
  messagingSenderId: "754680381192",
  appId: "PASTE_YOUR_REAL_FIREBASE_APP_ID_HERE"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

const statusBox=document.getElementById("status");
const latitudeBox=document.getElementById("latitude");
const longitudeBox=document.getElementById("longitude");
const speedBox=document.getElementById("speed");
const accuracyBox=document.getElementById("accuracy");
const lastUpdateBox=document.getElementById("lastUpdate");
const startBtn=document.getElementById("startBtn");
const stopBtn=document.getElementById("stopBtn");
const messageBox=document.getElementById("message");

let watchId=null;

startBtn.addEventListener("click",()=>{
  if(!navigator.geolocation){
    messageBox.innerText="❌ Is browser mein GPS supported nahi hai.";
    return;
  }
  statusBox.innerText="🟢 Tracking ON";
  statusBox.classList.add("on");
  startBtn.disabled=true;
  stopBtn.disabled=false;
  messageBox.innerText="📍 GPS permission maang raha hai...";

  watchId=navigator.geolocation.watchPosition(locationSuccess,locationError,{
    enableHighAccuracy:true, maximumAge:0, timeout:15000
  });
});

function locationSuccess(position){
  const coords=position.coords;
  const latitude=coords.latitude;
  const longitude=coords.longitude;
  const accuracy=coords.accuracy;

  let speedMS=coords.speed;
  if(speedMS===null || speedMS===undefined || !Number.isFinite(speedMS)) speedMS=0;
  if(speedMS<0.5) speedMS=0;

  latitudeBox.innerText=latitude.toFixed(6);
  longitudeBox.innerText=longitude.toFixed(6);
  speedBox.innerText=speedMS.toFixed(1)+" m/s";
  accuracyBox.innerText=accuracy.toFixed(1)+" m";

  const now=new Date();
  lastUpdateBox.innerText=now.toLocaleTimeString();
  messageBox.innerText="📡 GPS location received";

  set(ref(database,"gps/current"),{
    latitude:latitude,
    longitude:longitude,
    speed:Number(speedMS.toFixed(1)),
    speedUnit:"m/s",
    accuracy:Number(accuracy.toFixed(1)),
    timestamp:Date.now(),
    lastUpdate:now.toLocaleString()
  }).catch(error=>console.log("Firebase error:",error));
}

function locationError(error){
  if(error.code===1) messageBox.innerText="❌ GPS permission denied. Location permission Allow karein.";
  else if(error.code===2) messageBox.innerText="❌ Location available nahi hai. Mobile GPS ON karein.";
  else if(error.code===3) messageBox.innerText="⏳ GPS timeout. Thodi der wait karein.";
  else messageBox.innerText="❌ GPS error: "+error.message;
}

stopBtn.addEventListener("click",()=>{
  if(watchId!==null){
    navigator.geolocation.clearWatch(watchId);
    watchId=null;
  }
  statusBox.innerText="🔴 Tracking OFF";
  statusBox.classList.remove("on");
  startBtn.disabled=false;
  stopBtn.disabled=true;
  messageBox.innerText="GPS tracking stopped.";
});
</script>
</body>
</html>
